<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#150d30" />
  <meta name="description" content="とちぎ蚤の市　妖怪スタンプラリー - QRコードを読んでキャラクターをゲットしよう！" />
  <title>とちぎ蚤の市　妖怪スタンプラリー</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <style>
    #demo-bar {
      position: relative; z-index: 2;
      background: linear-gradient(90deg, #FFC107, #FF9800);
      color: #2A1400;
      text-align: center;
      padding: 7px 14px;
      font-size: 0.76rem;
      line-height: 1.5;
    }
    #demo-bar strong { font-weight: 900; letter-spacing: 0.12em; margin-right: 8px; }
    #demo-bar.hidden { display: none; }
    #complete-banner { display: block; text-decoration: none; cursor: pointer; }
    #complete-banner.hidden { display: none; }
    #complete-banner:active { transform: scale(0.985); }
    .complete-tap {
      display: inline-block; margin-top: 10px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px; padding: 5px 16px;
      font-size: 0.8rem; font-weight: 800; color: #fff;
    }
  </style>

</head>
<body>

  <!-- 背景写真 -->
  <div style="position:fixed;inset:0;z-index:0;background:url('https://pikaichi0407-a11y.github.io/pikaichi.APP/IMG_1011.jpeg') center top/cover no-repeat;"></div>
  <div style="position:fixed;inset:0;z-index:0;background:rgba(10,8,25,0.65);"></div>

  <!-- デモ表示中の帯（?demo=1 のときだけ出る） -->
  <div id="demo-bar" class="hidden">
    <strong>DEMO / 見本</strong>
    <span>全部集めた状態でお見せしています</span>
  </div>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1>&#127983; とちぎ蚤の市　妖怪スタンプラリー</h1>
    <p class="subtitle">QRコードを読んで妖怪を集めよう</p>
  </header>

  <main class="page-container">

    <!-- コンプリートバナー（全取得時に表示） -->
    <a id="complete-banner" class="complete-banner hidden" href="scan.html?all=1">
      <h2>&#127881; コンプリート！</h2>
      <p>全ての妖怪をゲット！おめでとうございます‼️</p>
      <span class="complete-tap">&#10022; 記念画面を見る</span>
    </a>

    <!-- 進捗表示 -->
    <section class="progress-section">
      <div class="progress-label">
        <span>スタンプ進捗</span>
        <strong><span id="progress-count">0 / 5</span></strong>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
    </section>

    <!-- スタンプカード一覧 -->
    <section>
      <div id="stamp-grid" class="stamp-grid">
        <p class="text-center" style="color:var(--text-sub);padding:20px;">読み込み中...</p>
      </div>
    </section>

    <!-- 使い方ガイド -->
    <section class="marker-guide mt-16">
      <p>各スポットにあるQRコードをスキャンしてスタンプをゲット！</p>
      <p style="font-size:0.8rem;margin-top:8px;color:var(--text-sub);">
        <span id="guide-total">6つ</span>全部集めてコンプリートを目指そう！
      </p>
    </section>

  </main>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <span class="nav-icon">&#127381;</span>
      スタンプ帳
    </a>
    <a href="scan.html">
      <span class="nav-icon">&#128247;</span>
      スキャン
    </a>
  </nav>

  <script src="js/stamps-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderStampGrid();
      const gt = document.getElementById('guide-total');
      if (gt) gt.textContent = TOTAL_STAMPS + 'つ';
      if (isDemoMode()) {
        document.getElementById('demo-bar').classList.remove('hidden');
        document.querySelectorAll('.bottom-nav a').forEach(a => {
          a.href = withDemo(a.getAttribute('href'));
        });
        const cb = document.getElementById('complete-banner');
        if (cb) cb.href = withDemo(cb.getAttribute('href'));
      }
    });
  </script>
</body>
</html>
