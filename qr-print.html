<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRコード印刷 - 十千木 百鬼夜行スタンプラリー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Meiryo', sans-serif;
      background: #eceaf3;
      color: #1d1b2b;
      padding: 20px 14px 60px;
    }

    /* ---------- 画面表示のときだけ出る案内 ---------- */
    .guide {
      max-width: 620px; margin: 0 auto 22px;
      background: white; border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.09);
    }
    .guide h1 { font-size: 1.15rem; margin-bottom: 4px; }
    .guide .sub { font-size: 0.85rem; color: #6b6880; margin-bottom: 16px; }
    .guide ol { margin: 0 0 4px 1.15em; }
    .guide li { font-size: 0.9rem; line-height: 1.95; }
    .guide .warn {
      margin-top: 14px; padding: 11px 13px;
      background: #FFF4E0; border-left: 4px solid #E8912B;
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem; line-height: 1.75;
    }
    .btn-print {
      display: block; width: 100%;
      margin-top: 16px; padding: 14px;
      background: #5C3FC0; color: white;
      border: none; border-radius: 999px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }
    .btn-print:active { background: #47309a; }
    .btn-back {
      display: block; text-align: center; margin-top: 10px;
      color: #5C3FC0; font-size: 0.88rem; text-decoration: none;
    }

    /* ---------- 掲示物 1枚ぶん ---------- */
    .sheet {
      max-width: 620px;
      margin: 0 auto 20px;
      background: white;
      border-radius: 14px;
      padding: 30px 26px 24px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.09);
      text-align: center;
      page-break-after: always;
      break-after: page;
    }
    .sheet:last-child { page-break-after: auto; break-after: auto; }

    .sheet-no {
      display: inline-block;
      background: #2b1d52; color: #FFD75E;
      font-size: 0.82rem; font-weight: 800;
      letter-spacing: 0.22em;
      padding: 5px 20px; border-radius: 999px;
    }
    .sheet-spot {
      font-size: 1.5rem; font-weight: 800;
      margin-top: 12px; line-height: 1.35;
    }
    .sheet-lead {
      font-size: 1.02rem; font-weight: 700;
      color: #3d3a52; margin-top: 16px;
    }
    .sheet-qr {
      width: 100%; max-width: 330px;
      margin: 14px auto 10px;
      border: 3px solid #1d1b2b; border-radius: 10px;
      display: block;
    }
    .sheet-note {
      font-size: 0.92rem; color: #4a4760; line-height: 1.85;
    }
    .sheet-tag {
      display: inline-block; margin-top: 12px;
      background: #f0edf8; color: #3d2f77;
      border-radius: 999px; padding: 6px 18px;
      font-size: 0.86rem; font-weight: 700;
    }
    .sheet-foot {
      margin-top: 18px; padding-top: 12px;
      border-top: 1px solid #ddd9ea;
      font-size: 0.76rem; color: #7d7a91; line-height: 1.7;
    }
    .staff {
      margin-top: 10px; font-size: 0.7rem; color: #a5a2b5;
    }

    /* ---------- 印刷時 ---------- */
    @media print {
      body { background: white; padding: 0; }
      .guide { display: none; }
      .sheet {
        max-width: none; margin: 0;
        box-shadow: none; border-radius: 0;
        padding: 26mm 18mm;
        min-height: 100vh;
        display: flex; flex-direction: column; justify-content: center;
      }
      .sheet-qr { max-width: 92mm; }
      .staff { display: none; }
    }
    @page { size: A4 portrait; margin: 0; }
  </style>
</head>
<body>

  <div class="guide">
    <h1>&#128438; QRコード印刷</h1>
    <p class="sub">各スポットに掲示するQRコードです（A4たて・1スポット1枚）</p>
    <ol>
      <li>下の「印刷する」を押す</li>
      <li>A4・カラー・余白なしで印刷</li>
      <li><strong>ラミネート加工</strong>してから設置</li>
    </ol>
    <div class="warn">
      <strong>屋外に貼るのでラミネート必須です。</strong><br>
      雨で濡れると読み取れなくなり、風で飛びます。<br>
      紙の左下に小さくスポット番号が入っているので、貼る場所を間違えません。
      <br><br>
      <strong>「携帯用」と書かれた2枚は貼りません。</strong><br>
      スタッフが会場を歩きながら持ちます。産女は<strong>手に持ち</strong>、
      河童は<strong>背負って</strong>ください。お客さんが見分けられるよう、
      この2つは必ず分けてください。
    </div>
    <button class="btn-print" onclick="window.print()">&#128424; 印刷する</button>
    <a class="btn-back" href="dev.html">&#8592; 開発者パネルに戻る</a>
  </div>

  <div id="sheets"></div>

  <script src="js/stamps-config.js"></script>
  <script>
    // QRコードは画像として同梱してあるので、ネットが不安定でも必ず印刷できる
    // 決まった場所がなく人が持ち歩くスポットは、掲示物ではなく「携帯用」として刷る
    const isMobile = (s) => s.spot.includes('移動中');

    document.getElementById('sheets').innerHTML = STAMPS_CONFIG.map((s) => `
      <div class="sheet">
        <span class="sheet-no">${isMobile(s) ? '携帯用 ' : ''}SPOT ${s.id}</span>
        <p class="sheet-spot">${s.spot}</p>
        <p class="sheet-lead">スマホのカメラをかざしてください</p>
        <img class="sheet-qr" src="qr/spot${s.id}.png" alt="スポット${s.id}のQRコード">
        <p class="sheet-note">
          読み取ると妖怪があらわれます<br>
          アプリのインストールは不要です
        </p>
        <span class="sheet-tag">参加無料</span>
        <div class="sheet-foot">
          十千木 百鬼夜行スタンプラリー<br>
          ${STAMPS_CONFIG.length}体すべて集めて本部テントへ
        </div>
        <p class="staff">
          ［スタッフ用］${s.id}／${STAMPS_CONFIG.length}　${s.name}　${s.spot}
          ${isMobile(s) ? '　※ 貼らずに持ち歩いてください' : ''}
        </p>
      </div>
    `).join('');
  </script>
</body>
</html>
