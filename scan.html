<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>QRスキャン - スタンプラリー</title>
  <!-- QR読取ライブラリ。アプリ内カメラでスキャンする時だけ必要なので defer で非同期に。
       標準カメラから ?id= で来た場合はこれを待たずに画面が出る（電波が悪い会場対策） -->
  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Meiryo', sans-serif;
      background: #0d0d1a;
      color: white;
      min-height: 100dvh;
      overflow: hidden;
    }

    .phase {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .phase.hidden { display: none; }

    #phase-scan {
      background: #0d0d1a;
      justify-content: flex-start;
    }

    .scan-header {
      width: 100%;
      background: rgba(255,255,255,0.06);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .scan-header h1 { font-size: 1.1rem; font-weight: 700; }
    .scan-header p  { font-size: 0.8rem; opacity: 0.6; margin-top: 4px; }

    .scan-body {
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
      overflow-y: auto;
    }

    .viewfinder {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #1a1a2e;
      box-shadow: 0 0 40px rgba(92,107,192,0.3);
    }
    #qr-reader { position: absolute; inset: 0; width: 100%; height: 100%; }
    #qr-reader select,
    #qr-reader__header_message,
    #qr-reader__dashboard_section_swaplink { display: none !important; }
    #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }

    #vf-placeholder {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; background: #1a1a2e;
    }
    .ph-icon { font-size: 3.5rem; }
    #vf-placeholder p { font-size: 0.85rem; color: rgba(255,255,255,0.45); }

    .corner-frame {
      position: absolute; inset: 0; z-index: 10;
      pointer-events: none; display: none;
    }
    .corner-frame::before,.corner-frame::after,
    .corner-frame > span::before,.corner-frame > span::after {
      content: ''; position: absolute;
      width: 28px; height: 28px;
      border-color: white; border-style: solid;
    }
    .corner-frame::before  { top:12px; left:12px;  border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    .corner-frame::after   { top:12px; right:12px; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
    .corner-frame > span::before { bottom:12px; left:12px;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
    .corner-frame > span::after  { bottom:12px; right:12px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }

    #scan-line {
      position: absolute; left:20px; right:20px; height:2px;
      background: linear-gradient(90deg, transparent, #5C6BC0, white, #5C6BC0, transparent);
      animation: scanMove 2s ease-in-out infinite;
      z-index: 11; display: none;
    }
    @keyframes scanMove { 0%,100%{ top:15%; } 50%{ top:80%; } }

    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 999px;
      font-size: 0.88rem; font-weight: 700;
      min-width: 240px; justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
      color: white; background: rgba(255,255,255,0.07);
    }
    .status-pill.scanning { background:rgba(92,107,192,0.25); border-color:rgba(92,107,192,0.5); }
    .status-pill.success  { background:rgba(46,125,50,0.35);  border-color:#66BB6A; }
    .status-pill.error    { background:rgba(198,40,40,0.3);   border-color:#EF5350; }
    .pulse-dot {
      width:8px; height:8px; border-radius:50%; background:#7986CB;
      animation: pdp 1.2s ease-in-out infinite;
    }
    @keyframes pdp { 0%,100%{opacity:1} 50%{opacity:.25} }

    #btn-start {
      background: #5C6BC0; color: white; border: none;
      border-radius: 999px; padding: 15px 0;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      width: 100%; max-width: 280px;
      box-shadow: 0 4px 20px rgba(92,107,192,0.5);
    }
    #btn-start:active { background: #3949AB; transform: scale(0.97); }

    .back-link {
      color: rgba(255,255,255,0.45); font-size: 0.85rem;
      text-decoration: none; padding: 8px;
    }

    #phase-image {
      background: #0d0d1a;
      justify-content: space-between;
      padding: max(24px, env(safe-area-inset-top)) 0
               max(24px, env(safe-area-inset-bottom));
    }

    .image-top {
      width: 100%;
      text-align: center;
      padding: 0 20px;
    }
    .image-top .stamp-no {
      font-size: 0.78rem;
      opacity: 0.5;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .char-img-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      width: 100%;
      position: relative;
    }

    /* ── 当たり演出：後光（回転する光線） ── */
    .burst {
      position: absolute;
      top: 50%; left: 50%;
      width: 150vmax; height: 150vmax;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      background: repeating-conic-gradient(
        from 0deg at 50% 50%,
        var(--ray, #FFD700) 0deg 5deg,
        transparent 5deg 16deg
      );
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 8%, transparent 52%);
      mask-image: radial-gradient(circle at 50% 50%, #000 8%, transparent 52%);
      animation: burstIn 0.55s ease-out 0.05s forwards,
                 spin 26s linear infinite;
    }
    @keyframes burstIn {
      from { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      to   { opacity: 0.30; transform: translate(-50%,-50%) scale(1); }
    }
    @keyframes spin {
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }

    /* ── 当たり演出：中央の光のにじみ ── */
    .glow {
      position: absolute;
      top: 50%; left: 50%;
      width: min(92vw, 460px); height: min(92vw, 460px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle,
        var(--glow, #5C6BC0) 0%,
        transparent 68%);
      opacity: 0;
      animation: glowIn 0.7s ease-out forwards;
    }
    @keyframes glowIn {
      from { opacity: 0;    transform: translate(-50%,-50%) scale(0.6); }
      to   { opacity: 0.55; transform: translate(-50%,-50%) scale(1); }
    }

    /* ── 当たり演出：パーティクル（Canvasで描画） ── */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .char-img-wrap {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
    }
    #char-image {
      max-width: min(90vw, 400px);
      max-height: 52vh;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.5));
      animation: charIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: block;
    }
    @keyframes charIn {
      from { transform: scale(0.7) translateY(30px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    #char-emoji-fallback {
      font-size: 8rem;
      line-height: 1.2;
      display: none;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.5));
      animation: charIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .speech-bubble {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 24, 0.78);
      color: white;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 8px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: bubbleIn 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    .speech-bubble.hidden { display: none; }
    @keyframes bubbleIn {
      from { transform: translateX(-50%) scale(0.8) translateY(6px); opacity: 0; }
      to   { transform: translateX(-50%) scale(1)   translateY(0);   opacity: 1; }
    }

    .image-bottom {
      width: 100%;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 3;
    }

    /* 「妖怪をゲット！」の帯 */
    .get-badge {
      display: inline-block;
      background: linear-gradient(135deg, #FFE066, #FFB300, #FF8C00);
      color: #2A1400;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      padding: 4px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(255,180,0,0.45);
      animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.45s both;
    }
    @keyframes badgePop {
      from { transform: scale(0.3) rotate(-12deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);   opacity: 1; }
    }

    #img-char-name {
      font-size: clamp(1.7rem, 8vw, 2.3rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.04em;
      line-height: 1.2;
      background: linear-gradient(180deg, #FFF6D5 0%, #FFD24A 55%, #F0A000 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
      animation: nameIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.6s both;
    }
    @keyframes nameIn {
      from { transform: scale(0.55) translateY(18px); opacity: 0; }
      to   { transform: scale(1)    translateY(0);    opacity: 1; }
    }

    #img-char-sub {
      font-size: 0.88rem;
      opacity: 0.75;
      text-align: center;
      margin-bottom: 4px;
      animation: fadeUp 0.5s ease-out 0.85s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 0.75; transform: translateY(0); }
    }

    #btn-stamp-get {
      width: 100%; max-width: 320px;
      background: #5C6BC0;
      color: white; border: none;
      border-radius: 999px;
      padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(92,107,192,0.5);
      transition: transform 0.15s, background 0.2s;
      animation: fadeUp2 0.5s ease-out 1s both;
    }
    @keyframes fadeUp2 {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #btn-stamp-get:active { transform: scale(0.96); }

    @media (prefers-reduced-motion: reduce) {
      .burst, .glow, .get-badge,
      #img-char-name, #img-char-sub, #btn-stamp-get,
      #char-image, .speech-bubble {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    #phase-complete {
      background: #f5f5f5;
      color: #212121;
      justify-content: center;
      overflow-y: auto;
    }

    .confetti-area {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      border-radius: 2px;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .complete-card {
      position: relative; z-index: 1;
      background: white;
      border-radius: 28px;
      padding: 32px 24px 28px;
      margin: 20px;
      max-width: 380px;
      width: calc(100% - 40px);
      text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,0.12);
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cardIn {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    .complete-badge {
      display: inline-block;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      color: white;
      font-size: 0.85rem; font-weight: 900;
      padding: 5px 20px; border-radius: 999px;
      margin-bottom: 16px;
      letter-spacing: 0.06em;
    }
    .complete-badge.already {
      background: linear-gradient(135deg, #78909C, #546E7A);
    }

    .complete-char-img {
      width: 140px; height: 140px;
      object-fit: contain;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    }
    .complete-emoji-fallback {
      font-size: 5rem;
      display: block;
      margin-bottom: 12px;
      line-height: 1;
    }

    .complete-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; color: #212121; }
    .complete-sub  { font-size: 0.88rem; color: #757575; margin-bottom: 20px; }

    .btn-to-list {
      display: block; width: 100%;
      background: #5C6BC0; color: white;
      border: none; border-radius: 999px;
      padding: 14px; font-size: 0.95rem; font-weight: 700;
      text-align: center; text-decoration: none;
      cursor: pointer; margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(92,107,192,0.35);
    }
    .btn-next-scan {
      display: block; width: 100%;
      background: white; color: #5C6BC0;
      border: 2px solid #5C6BC0; border-radius: 999px;
      padding: 12px; font-size: 0.95rem; font-weight: 700;
      text-align: center; cursor: pointer;
    }
    .btn-to-list:active  { opacity: 0.85; }
    .btn-next-scan:active { background: #f0f4ff; }
  </style>
</head>
<body>

<div id="phase-scan" class="phase">
  <header class="scan-header">
    <h1>&#128247; QRコードをスキャン</h1>
    <p>スタンプのQRコードにカメラを向けてください</p>
  </header>
  <div class="scan-body">
    <div class="viewfinder">
      <div id="qr-reader"></div>
      <div id="vf-placeholder">
        <div class="ph-icon">&#128247;</div>
        <p>「スキャン開始」を押してください</p>
      </div>
      <div class="corner-frame" id="corner-frame"><span></span></div>
      <div id="scan-line"></div>
    </div>
    <div class="status-pill" id="status-pill">QRコードを読み取ります</div>
    <button id="btn-start" onclick="startScan()">&#128247; スキャン開始</button>
    <a href="index.html" class="back-link">&#8592; スタンプ帳に戻る</a>
  </div>
</div>

<div id="phase-image" class="phase hidden">
  <canvas id="fx-canvas"></canvas>
  <div class="image-top">
    <p class="stamp-no" id="img-stamp-no">STAMP #1</p>
  </div>
  <div class="char-img-area">
    <div class="burst" id="burst"></div>
    <div class="glow"  id="glow"></div>    <div class="char-img-wrap">
      <img id="char-image" src="" alt="" />
      <span id="char-emoji-fallback"></span>
      <div class="speech-bubble hidden" id="speech-bubble">
        <p id="speech-text"></p>
      </div>
    </div>
  </div>
  <div class="image-bottom">
    <span class="get-badge">妖怪をゲット！</span>
    <p id="img-char-name"></p>
    <p id="img-char-sub"></p>
    <button id="btn-stamp-get" onclick="showCompletePhase()">
      &#127881; スタンプ帳に押す
    </button>
  </div>
</div>

<div id="phase-complete" class="phase hidden">
  <div class="confetti-area" id="confetti-area"></div>
  <div class="complete-card">
    <div class="complete-badge" id="complete-badge">&#127881; スタンプGET！</div>
    <img id="complete-char-img" class="complete-char-img" src="" alt=""
         onerror="this.style.display='none'; document.getElementById('complete-emoji-fb').style.display='block';" />
    <span id="complete-emoji-fb" class="complete-emoji-fallback" style="display:none;"></span>
    <p class="complete-name" id="complete-name"></p>
    <p class="complete-sub"  id="complete-sub"></p>
    <a href="index.html" class="btn-to-list">&#127381; スタンプ帳を見る</a>
    <button class="btn-next-scan" onclick="resetToScan()">&#128247; 次のQRをスキャン</button>
  </div>
</div>

<script src="js/stamps-config.js"></script>
<script src="js/app.js"></script>
<script>
  let scanner  = null;
  let active   = false;
  let lastErrT = 0;
  let curStamp = null;
  let curIsNew = false;

  function setStatus(text, type) {
    const el = document.getElementById('status-pill');
    el.className = 'status-pill' + (type ? ' ' + type : '');
    el.innerHTML = type === 'scanning'
      ? `<span class="pulse-dot"></span><span>${text}</span>`
      : text;
  }

  function startScan() {
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('&#9888;&#65039; 読み込み中です。少し待って再度お試しください', 'error');
      return;
    }
    document.getElementById('btn-start').style.display = 'none';
    setStatus('カメラを起動中...', '');
    scanner = new Html5Qrcode('qr-reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 200, height: 200 }, aspectRatio: 1 },
      onScanSuccess,
      () => {}
    ).then(() => {
      active = true;
      document.getElementById('vf-placeholder').style.display = 'none';
      document.getElementById('corner-frame').style.display   = 'block';
      document.getElementById('scan-line').style.display      = 'block';
      setStatus('スキャン中... QRコードに向けてください', 'scanning');
    }).catch(() => {
      document.getElementById('btn-start').style.display = 'block';
      setStatus('&#9888;&#65039; カメラを起動できません。許可してください', 'error');
    });
  }

  function onScanSuccess(text) {
    if (!active) return;
    let stampId = null;
    try {
      const url = new URL(text);
      if (url.pathname.includes('ar.html') || url.pathname.includes('stamp.html')) {
        stampId = url.searchParams.get('id');
      }
    } catch {
      const m = text.match(/(?:ar|stamp)\.html\?(?:.*&)?id=(\d+)/);
      if (m) stampId = m[1];
    }
    const id = Number(stampId);
    if (id >= 1 && id <= 5) {
      active = false;
      scanner.stop().catch(() => {});
      showImagePhase(id);
    } else {
      const now = Date.now();
      if (now - lastErrT > 2500) {
        lastErrT = now;
        setStatus('&#9888;&#65039; スタンプ用QRコードではありません', 'error');
        setTimeout(() => {
          if (active) setStatus('スキャン中... QRコードに向けてください', 'scanning');
        }, 2500);
      }
    }
  }

  function showImagePhase(id) {
    curStamp = STAMPS_CONFIG.find(s => s.id === id);
    if (!curStamp) return;
    curIsNew = collectStamp(id);

    const bubble = document.getElementById('speech-bubble');
    bubble.classList.add('hidden');
    void bubble.offsetWidth;
    if (curStamp.speech) {
      document.getElementById('speech-text').textContent = '「' + curStamp.speech + '」';
      bubble.classList.remove('hidden');
    }

    const emojiEl = document.getElementById('char-emoji-fallback');
    emojiEl.style.display = 'none';
    emojiEl.textContent   = '';

    const imgEl = document.getElementById('char-image');
    imgEl.style.display = '';
    imgEl.src = curStamp.image;
    imgEl.alt = curStamp.name;
    imgEl.onerror = () => {
      if (!curStamp) return;
      imgEl.style.display   = 'none';
      emojiEl.textContent   = curStamp.emoji;
      emojiEl.style.display = 'block';
    };

    document.getElementById('img-stamp-no').textContent  = curStamp.spot
      ? `STAMP #${curStamp.id}　${curStamp.spot}`
      : `STAMP #${curStamp.id}`;
    document.getElementById('img-char-name').textContent = curStamp.name;
    document.getElementById('img-char-sub').textContent  = curStamp.subtitle;
    document.getElementById('btn-stamp-get').style.background = curStamp.color;
    document.getElementById('btn-stamp-get').style.boxShadow  = `0 6px 24px ${curStamp.color}55`;
    document.getElementById('phase-image').style.background   =
      `radial-gradient(ellipse at 50% 42%, ${curStamp.color}33 0%, #0d0d1a 62%)`;

    document.getElementById('phase-scan').classList.add('hidden');
    document.getElementById('phase-image').classList.remove('hidden');

    // 当たり演出は画面を表示してから。非表示のままだと Canvas の
    // 幅・高さが 0 になり、パーティクルが描画されない
    requestAnimationFrame(() => playRevealFX());
  }

  /* ────────────────────────────────────────
     当たり演出：後光・光のにじみ・舞い上がるキラキラ
  ──────────────────────────────────────── */
  function playRevealFX() {
    const burst  = document.getElementById('burst');
    const glow   = document.getElementById('glow');
    const badge  = document.querySelector('.get-badge');
    const nameEl = document.getElementById('img-char-name');
    const subEl  = document.getElementById('img-char-sub');
    const btnEl  = document.getElementById('btn-stamp-get');

    // 光をキャラクターの色に合わせる
    burst.style.setProperty('--ray',  curStamp.color);
    glow.style.setProperty('--glow',  curStamp.color);

    // アニメーションを頭から再生し直す（2体目以降も演出が出るように）
    [burst, glow, badge, nameEl, subEl, btnEl,
     document.getElementById('char-image'),
     document.getElementById('char-emoji-fallback')].forEach(el => {
      if (!el) return;
      const a = el.style.animation;
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = a || '';
    });

    // パーティクルを打ち上げる
    launchParticles(curStamp.color);
  }

  /* ────────────────────────────────────────
     パーティクル演出（Canvas）
     ・放射状の光の筋
     ・4条のレンズフレア（キラッと瞬く星）
     ・ゆらゆら昇る光の粒
  ──────────────────────────────────────── */
  let fxRAF = null;

  function launchParticles(themeColor) {
    const cv = document.getElementById('fx-canvas');
    if (!cv) return;

    // 動きを減らす設定の端末では演出しない
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    if (fxRAF) cancelAnimationFrame(fxRAF);
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cx = W / 2, cy = H * 0.42;
    const GOLD = [255, 214, 92];
    const WHITE = [255, 250, 235];
    const theme = hexToRGB(themeColor) || [120, 160, 255];
    const palette = [GOLD, WHITE, GOLD, theme];

    const P = [];

    // ① 放射状の光の筋（一瞬で散る）
    for (let i = 0; i < 26; i++) {
      const a = (Math.PI * 2 * i) / 26 + Math.random() * 0.2;
      const sp = 7 + Math.random() * 9;
      P.push({ kind: 'streak', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
               len: 26 + Math.random() * 46, life: 0, max: 26 + Math.random() * 14,
               col: palette[i % palette.length], w: 1.4 + Math.random() * 1.8 });
    }

    // ② レンズフレア（キラッと瞬く4条の星）
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 190;
      P.push({ kind: 'star', x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 0.85,
               r: 9 + Math.random() * 26, rot: Math.random() * Math.PI,
               spin: (Math.random() - 0.5) * 0.05,
               life: -Math.random() * 34, max: 52 + Math.random() * 40,
               col: Math.random() < 0.62 ? GOLD : WHITE,
               vy: -0.24 - Math.random() * 0.5 });
    }

    // ③ ゆらゆら昇る光の粒
    for (let i = 0; i < 46; i++) {
      P.push({ kind: 'ember', x: cx + (Math.random() - 0.5) * W * 0.92,
               y: cy + 40 + Math.random() * H * 0.42,
               r: 1.6 + Math.random() * 4.4,
               vy: -0.5 - Math.random() * 1.5,
               drift: (Math.random() - 0.5) * 0.45,
               phase: Math.random() * Math.PI * 2,
               life: -Math.random() * 56, max: 96 + Math.random() * 68,
               col: palette[i % palette.length] });
    }

    function frame() {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';   // 光は重なるほど明るく
      let alive = false;

      for (const p of P) {
        p.life++;
        if (p.life < 0) { alive = true; continue; }
        if (p.life > p.max) continue;
        alive = true;
        const t = p.life / p.max;
        const fade = 1 - t;

        if (p.kind === 'streak') {
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.9; p.vy *= 0.9;
          const g = ctx.createLinearGradient(p.x, p.y,
                    p.x - p.vx * p.len * 0.1, p.y - p.vy * p.len * 0.1);
          g.addColorStop(0, rgba(p.col, fade * 0.95));
          g.addColorStop(1, rgba(p.col, 0));
          ctx.strokeStyle = g;
          ctx.lineWidth = p.w * fade;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * p.len * 0.1, p.y - p.vy * p.len * 0.1);
          ctx.stroke();

        } else if (p.kind === 'star') {
          p.y += p.vy; p.rot += p.spin;
          // 出はじめに大きく開いて、消え際に絞る（瞬き）
          const tw = Math.sin(t * Math.PI);
          drawFlare(ctx, p.x, p.y, p.r * (0.35 + tw * 0.9), p.rot, p.col, tw);

        } else {
          p.phase += 0.055;
          p.y += p.vy;
          p.x += p.drift + Math.sin(p.phase) * 0.55;
          const a = Math.sin(t * Math.PI) * 0.92;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.4);
          g.addColorStop(0,    rgba(p.col, a));
          g.addColorStop(0.35, rgba(p.col, a * 0.42));
          g.addColorStop(1,    rgba(p.col, 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      if (alive) { fxRAF = requestAnimationFrame(frame); }
      else { ctx.clearRect(0, 0, W, H); fxRAF = null; }
    }
    fxRAF = requestAnimationFrame(frame);
  }

  /* 4条のレンズフレアを1つ描く */
  function drawFlare(ctx, x, y, r, rot, col, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // 中心のにじみ
    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.52);
    core.addColorStop(0, rgba([255, 255, 255], alpha));
    core.addColorStop(0.5, rgba(col, alpha * 0.55));
    core.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.52, 0, Math.PI * 2); ctx.fill();

    // 十字の光条（縦長・横長の2枚を重ねる）
    const spike = (len, thick) => {
      const g = ctx.createLinearGradient(0, -len, 0, len);
      g.addColorStop(0,    rgba(col, 0));
      g.addColorStop(0.5,  rgba([255, 255, 255], alpha));
      g.addColorStop(1,    rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -len);
      ctx.quadraticCurveTo(thick, 0, 0, len);
      ctx.quadraticCurveTo(-thick, 0, 0, -len);
      ctx.fill();
    };
    spike(r, r * 0.11);
    ctx.rotate(Math.PI / 2);
    spike(r * 0.68, r * 0.08);

    ctx.restore();
  }

  function hexToRGB(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
  }
  function rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a))})`;
  }

  function showCompletePhase() {
    if (!curStamp) return;
    const badge = document.getElementById('complete-badge');
    if (curIsNew) {
      badge.textContent = '🎉 スタンプGET！';
      badge.classList.remove('already');
    } else {
      badge.textContent = '✅ 取得済み';
      badge.classList.add('already');
    }
    const cImg = document.getElementById('complete-char-img');
    cImg.src   = curStamp.image;
    cImg.alt   = curStamp.name;
    cImg.style.display = 'block';
    document.getElementById('complete-emoji-fb').style.display = 'none';
    document.getElementById('complete-emoji-fb').textContent   = curStamp.emoji;
    document.getElementById('complete-name').textContent = curStamp.name;
    document.getElementById('complete-sub').textContent  = curStamp.subtitle;
    document.querySelector('.btn-to-list').style.background = curStamp.color;
    document.getElementById('phase-image').classList.add('hidden');
    document.getElementById('phase-complete').classList.remove('hidden');
    if (curIsNew) launchConfetti();
  }

  function resetToScan() {
    document.getElementById('phase-complete').classList.add('hidden');
    document.getElementById('phase-scan').classList.remove('hidden');
    document.getElementById('confetti-area').innerHTML = '';
    document.getElementById('btn-start').style.display = 'block';
    const imgEl = document.getElementById('char-image');
    // src を空にすると onerror が発火するため、先にハンドラを外す
    imgEl.onerror = null;
    imgEl.style.display = '';
    imgEl.removeAttribute('src');
    const emjEl = document.getElementById('char-emoji-fallback');
    emjEl.style.display = 'none';
    emjEl.textContent   = '';
    setStatus('QRコードを読み取ります', '');
    active   = false;
    scanner  = null;
    curStamp = null;
  }

  /* ────────────────────────────────────────
     QRコードから直接開かれた場合（?id=X）
     スマホの標準カメラでQRを読むとここに来る。
     カメラ画面を飛ばして、いきなりキャラクター表示へ。
  ──────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    const raw = new URLSearchParams(location.search).get('id');
    if (!raw) return;
    const id = Number(raw);
    if (!Number.isInteger(id) || id < 1 || id > 5) return;
    showImagePhase(id);
  });

  function launchConfetti() {
    const area   = document.getElementById('confetti-area');
    const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#C9B1FF','#FF7043','#5C6BC0'];
    area.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left              = Math.random() * 100 + 'vw';
      p.style.background        = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      p.style.animationDelay    = Math.random() * 0.6 + 's';
      p.style.width             = (6 + Math.random() * 8) + 'px';
      p.style.height            = (6 + Math.random() * 8) + 'px';
      p.style.borderRadius      = Math.random() > 0.5 ? '50%' : '2px';
      area.appendChild(p);
    }
    setTimeout(() => { area.innerHTML = ''; }, 4000);
  }
</script>
